[project]
name = "faq-chatbot"
version = "0.1.0"
description = "A production-structured Korean FAQ RAG portfolio application."
requires-python = ">=3.12"
dependencies = [
  "chromadb>=1.0.0,<2.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "openai>=1.109.0,<2.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "playwright>=1.55.0,<2.0.0",
  "pre-commit>=4.0.0,<5.0.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
  "pyright>=1.1.390,<2.0.0",
  "ruff>=0.8.0,<1.0.0",
]

[project.scripts]
faq-chatbot = "faq_chatbot.main:run"
faq-index = "faq_chatbot.ingestion:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faq_chatbot"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=faq_chatbot --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["faq_chatbot"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]
